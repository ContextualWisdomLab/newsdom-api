name: One-shot finalize review fixes

on:
  push:
    branches: [claude/contextualwisdomlab-audit-governance-qyxe67]

concurrency:
  group: one-shot-finalize-review-fixes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize-review-fixes:
    if: github.repository == 'ContextualWisdomLab/newsdom-api'
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v7.4.0
        with:
          version: '0.11.3'
          enable-cache: false

      - name: Correct changelog wording and refresh the direct docs lock edge
        run: |
          set -euo pipefail
          cp uv.lock "${RUNNER_TEMP}/uv.lock.before"
          python3 <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "9.7.x는 상한을 `>=10.2`로 완화"
          new = "9.7.x는 기존 `<11` 상한을 제거"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale pymdown constraint phrase")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv lock
          python3 <<'PY'
          from pathlib import Path
          import re

          before = Path("${{ runner.temp }}/uv.lock.before").read_text(encoding="utf-8")
          after = Path("uv.lock").read_text(encoding="utf-8")

          def blocks(text: str) -> dict[str, str]:
              result: dict[str, str] = {}
              for block in re.split(r"(?=^\[\[package\]\]$)", text, flags=re.MULTILINE):
                  match = re.search(r'^name = "([^"]+)"$', block, re.MULTILINE)
                  if match:
                      result[match.group(1)] = block
              return result

          before_blocks = blocks(before)
          after_blocks = blocks(after)
          if before_blocks.keys() != after_blocks.keys():
              raise SystemExit("uv lock changed the resolved package set")
          for name in before_blocks:
              if name == "newsdom-api":
                  continue
              if before_blocks[name] != after_blocks[name]:
                  raise SystemExit(f"uv lock changed unrelated package block: {name}")
          root = after_blocks["newsdom-api"]
          if root.count('name = "pymdown-extensions"') < 2:
              raise SystemExit("project lock metadata is missing the direct pymdown edge")
          match = re.search(
              r'\[\[package\]\]\nname = "pymdown-extensions"\nversion = "([^"]+)"',
              after,
          )
          if match is None or tuple(map(int, match.group(1).split("."))) < (11, 0, 0):
              raise SystemExit("pymdown-extensions lock remains below the patched floor")
          PY

      - name: Verify locked docs and complete test suite
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra docs
          uv run pytest -q
          uv run mkdocs build --strict

      - name: Publish verified review fixes and remove this one-shot workflow
        env:
          BRANCH_NAME: claude/contextualwisdomlab-audit-governance-qyxe67
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-finalize-review-fixes.yml
          git add CHANGELOG.md uv.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(docs): finalize patched documentation dependency floor"
          git push origin "HEAD:${BRANCH_NAME}"
