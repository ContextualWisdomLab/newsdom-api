name: codeql

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '43 5 * * 1'
  # Deliberately no pull_request trigger: ContextualWisdomLab organization
  # ruleset "CWL Central required workflows" (id 18156473) already requires
  # the central .github/workflows/codeql-pr.yml on every PR to this repo's
  # inherited branches, uploading merge-preview SARIF on the real merge
  # commit SHA. Keeping a repository-local pull_request trigger here would
  # duplicate that scan on every push and consume runner admission twice
  # for the same PR head, without adding coverage -- see
  # ContextualWisdomLab/.github's docs/org-required-workflow-rollout.md
  # "Code scanning required workflow posture" section. This workflow stays
  # for push/schedule branch-history scanning, which the central PR gate
  # does not cover.

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: codeql (python, actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: python, actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
