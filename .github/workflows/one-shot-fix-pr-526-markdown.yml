name: One-shot fix PR 526 markdown

on:
  push:
    branches: [palette-openapi-dx-1911440224761899438]

concurrency:
  group: one-shot-fix-pr-526-markdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/newsdom-api'
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: palette-openapi-dx-1911440224761899438
          fetch-depth: 0

      - name: Move the DX entry into the canonical Unreleased section
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          bullet = (
              "- [UX/DX] OpenAPI Swagger 문서 이해도 향상을 위해 "
              "`ParseQuality` 및 `HealthResponse` 모델에 구체적인 "
              "`json_schema_extra` 예제 추가. (Palette)"
          )
          duplicate = f"\n## [Unreleased]\n### Added\n{bullet}\n"
          if text.count(duplicate) != 1:
              raise SystemExit("expected exactly one duplicate trailing Unreleased block")
          text = text.replace(duplicate, "\n")
          marker = "### Added\n"
          if text.count(marker) < 1:
              raise SystemExit("canonical Unreleased Added section is missing")
          before, after = text.split(marker, 1)
          if bullet in before or bullet in after:
              raise SystemExit("DX changelog bullet already exists outside duplicate block")
          text = before + marker + bullet + "\n" + after
          if text.count("## [Unreleased]") != 1:
              raise SystemExit("CHANGELOG must contain exactly one Unreleased heading")
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Publish the verified repair and remove this one-shot workflow
        env:
          BRANCH_NAME: palette-openapi-dx-1911440224761899438
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-pr-526-markdown.yml
          git add CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: consolidate OpenAPI DX changelog entry"
          git push origin "HEAD:${BRANCH_NAME}"
