name: One-shot refresh Atheris lock

on:
  push:
    branches: [dependabot/pip/develop/python-be28e05158]

concurrency:
  group: one-shot-refresh-atheris-lock
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/pip/develop/python-be28e05158
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Refresh only Atheris and project lock metadata
        run: |
          set -euo pipefail
          cp uv.lock "${RUNNER_TEMP}/uv.lock.before"
          uv lock --upgrade-package atheris
          python3 <<'PY'
          from pathlib import Path
          import re

          before = Path("${{ runner.temp }}/uv.lock.before").read_text(encoding="utf-8")
          after = Path("uv.lock").read_text(encoding="utf-8")

          def blocks(text: str) -> list[tuple[str, str]]:
              result: list[tuple[str, str]] = []
              for block in re.split(r"(?=^\[\[package\]\]$)", text, flags=re.MULTILINE):
                  match = re.search(r'^name = "([^"]+)"$', block, re.MULTILINE)
                  if match:
                      result.append((match.group(1), block))
              return result

          before_blocks = blocks(before)
          after_blocks = blocks(after)
          before_unchanged = [
              block for name, block in before_blocks if name not in {"atheris", "newsdom-api"}
          ]
          after_unchanged = [
              block for name, block in after_blocks if name not in {"atheris", "newsdom-api"}
          ]
          if before_unchanged != after_unchanged:
              raise SystemExit("Atheris lock refresh changed an unrelated package block")

          atheris_blocks = [block for name, block in after_blocks if name == "atheris"]
          versions = {
              match.group(1)
              for block in atheris_blocks
              if (match := re.search(r'^version = "([^"]+)"$', block, re.MULTILINE))
          }
          if versions != {"3.0.0", "3.1.0"}:
              raise SystemExit(f"unexpected Atheris lock versions: {sorted(versions)}")

          root_blocks = [block for name, block in after_blocks if name == "newsdom-api"]
          if len(root_blocks) != 1:
              raise SystemExit("expected one NewsDOM project package block")
          root = root_blocks[0]
          for specifier in ('specifier = "==3.0.0"', 'specifier = "==3.1.0"'):
              if specifier not in root:
                  raise SystemExit(f"project lock metadata omitted {specifier}")
          PY

      - name: Verify Python 3.12 selects Atheris 3.1.0
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra fuzz
          uv run python -c 'import importlib.metadata as m; assert m.version("atheris") == "3.1.0"'
          uv run pytest -q

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify Python 3.11 retains Atheris 3.0.0 support
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --locked --extra dev --extra fuzz
          uv run python -c 'import importlib.metadata as m; assert m.version("atheris") == "3.0.0"'
          uv run pytest -q

      - name: Publish verified lock and remove this one-shot workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: dependabot/pip/develop/python-be28e05158
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-refresh-atheris-lock.yml
          git add uv.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps-dev): split Atheris pins by Python support"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH_NAME}"
