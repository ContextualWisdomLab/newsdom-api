name: One-shot refresh project lock

on:
  push:
    branches: [claude/contextualwisdomlab-audit-governance-qyxe67]

concurrency:
  group: one-shot-refresh-project-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'ContextualWisdomLab/newsdom-api'
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: claude/contextualwisdomlab-audit-governance-qyxe67
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v7.4.0
        with:
          version: '0.11.3'
          enable-cache: false

      - name: Refresh only the project metadata in uv.lock
        run: |
          set -euo pipefail
          cp uv.lock "${RUNNER_TEMP}/uv.lock.before"
          uv lock
          python3 <<'PY'
          from pathlib import Path

          before = Path("${{ runner.temp }}/uv.lock.before").read_text(encoding="utf-8")
          after = Path("uv.lock").read_text(encoding="utf-8")
          expected = before.replace(
              '{ name = "pillow", specifier = ">=11.0,<13.0" }',
              '{ name = "pillow", specifier = ">=12.3,<13.0" }',
          ).replace(
              '{ name = "pypdf", specifier = ">=6.13.3,<7.0" }',
              '{ name = "pypdf", specifier = ">=6.14.2,<7.0" }',
          )
          if expected == before:
              raise SystemExit("expected stale direct-floor metadata was not present")
          if after != expected:
              raise SystemExit(
                  "uv lock changed more than the two reviewed project metadata floors"
              )
          PY

      - name: Verify locked installation and complete test suite
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run pytest -q

      - name: Publish the verified lock and remove this one-shot workflow
        env:
          BRANCH_NAME: claude/contextualwisdomlab-audit-governance-qyxe67
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-refresh-project-lock.yml
          git add uv.lock
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): synchronize patched project floors in uv.lock"
          git push origin "HEAD:${BRANCH_NAME}"
