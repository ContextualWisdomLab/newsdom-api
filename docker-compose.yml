# Standalone / sidecar deployment for the NewsDOM PDF-to-DOM service.
#
# This production-oriented example fails before startup when NEWSDOM_API_TOKEN
# is absent. The default API image does not bundle MinerU, so `/ready` remains
# unavailable until a compatible executable is installed or mounted.
services:
  newsdom-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsdom-api:latest
    ports:
      - "8000:8000"
    environment:
      NEWSDOM_AUTH_MODE: required
      NEWSDOM_RUNTIME_PROFILE: production
      NEWSDOM_API_TOKEN: "${NEWSDOM_API_TOKEN:?set NEWSDOM_API_TOKEN}"
      NEWSDOM_MAX_CONCURRENT_PARSES: "1"
      # Point this at a bundled or mounted executable when the default API-only
      # image is used. The NVIDIA image already supplies its MinerU runtime.
      # NEWSDOM_MINERU_BIN: /opt/mineru/bin/mineru
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
