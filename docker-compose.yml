# Standalone / sidecar deployment for the NewsDOM PDF-to-DOM service.
#
# The default `Dockerfile` ships the API only and does NOT bundle the MinerU
# runtime, so `/parse` returns 503 until a MinerU runtime is available inside
# the image or is pointed to via `NEWSDOM_MINERU_BIN`. The healthcheck below
# targets the unauthenticated `/health` liveness endpoint so a missing parser
# runtime does not restart the API process. Use `/ready` for traffic-routing
# readiness; it returns 503 until the MinerU executable is discoverable.
services:
  newsdom-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: newsdom-api:latest
    ports:
      - "8000:8000"
    environment:
      # Optional: point at a bundled/host MinerU executable so /parse can run.
      # NEWSDOM_MINERU_BIN: /opt/mineru/bin/mineru
      # Optional: when set, /parse requires `Authorization: Bearer <token>`.
      # Provide via your orchestrator's secret store rather than inline.
      # NEWSDOM_API_TOKEN: ${NEWSDOM_API_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
