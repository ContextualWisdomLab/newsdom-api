apiVersion: v1
kind: Namespace
metadata:
  name: newsdom-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsdom-api
  namespace: newsdom-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: newsdom-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newsdom-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: newsdom-api
          # Unreleased example only. Replace this placeholder with an approved,
          # immutable image digest after release acceptance.
          image: ghcr.io/contextualwisdomlab/newsdom-api:unreleased
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME
              value: /home/newsdom
            - name: XDG_CACHE_HOME
              value: /home/newsdom/.cache
            - name: NEWSDOM_AUTH_MODE
              value: required
            - name: NEWSDOM_RUNTIME_PROFILE
              value: production
            - name: NEWSDOM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: newsdom-api-runtime
                  key: api_token
            - name: NEWSDOM_MAX_CONCURRENT_PARSES
              value: "1"
            - name: NEWSDOM_MINERU_BIN
              value: /opt/mineru/bin/mineru
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
              readOnly: false
            - name: runtime-cache
              mountPath: /home/newsdom
              readOnly: false
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 1Gi
        - name: runtime-cache
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: newsdom-api
  namespace: newsdom-system
spec:
  selector:
    app.kubernetes.io/name: newsdom-api
  ports:
    - name: http
      port: 8000
      targetPort: http
