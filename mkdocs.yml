site_name: NewsDOM API 매뉴얼
site_url: https://contextualwisdomlab.github.io/newsdom-api/
site_description: 다국어 PDF를 구조화된 DOM형 JSON으로 변환하는 NewsDOM API 문서
repo_url: https://github.com/ContextualWisdomLab/newsdom-api
repo_name: ContextualWisdomLab/newsdom-api

docs_dir: manual

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

nav:
  - 시작하기: index.md
  - 설치 가이드: installation.md
  - 사용 방법 및 API: api-reference.md
  - 개발 및 기여:
      - development.md
      - 워크플로우:
          - workflow/ocr-accuracy-evidence.md
